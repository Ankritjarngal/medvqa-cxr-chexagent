name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GPU-free dependencies
        run: pip install requests pandas pillow pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v
